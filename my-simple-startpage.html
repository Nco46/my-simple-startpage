<!doctype html>
<html lang="fr" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma Startpage</title>
  <!-- Favicon mise à jour dynamiquement (voir renderHeader) -->
  <link id="favicon" rel="icon" />
  <style>
    /* ================================================================
     THÈMES — Toutes les couleurs passent par des variables CSS.
     Ajouter un thème = ajouter un bloc [data-theme="..."].
  ================================================================ */
    :root {
      --radius: 14px;
      --radius-sm: 10px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --bg: radial-gradient(1200px 800px at 80% -10%, #1b2233 0%, #0e1116 55%);
      --surface: #171c26;
      --surface-2: #1d2330;
      --text: #e8ebf2;
      --muted: #8d95a8;
      --border: #262d3d;
      --accent: #6d8dff;
      --accent-soft: rgba(109, 141, 255, 0.15);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg: radial-gradient(1200px 800px at 80% -10%, #e8edfb 0%, #f6f7fb 55%);
      --surface: #ffffff;
      --surface-2: #f2f4f9;
      --text: #1b2334;
      --muted: #5c6579;
      --border: #e3e7f0;
      --accent: #3b5bdb;
      --accent-soft: rgba(59, 91, 219, 0.12);
      --shadow: 0 8px 24px rgba(30, 41, 80, 0.12);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ================= Barre supérieure ================= */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;
      padding: 22px clamp(16px, 4vw, 48px) 10px;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border-bottom: 1px solid var(--border);

      transition:
        box-shadow 0.2s ease,
        background-color 0.2s ease;
    }

    [data-theme="dark"] #topbar {
      background: rgba(23, 28, 38, 0.88);
    }

    [data-theme="light"] #topbar {
      background: rgba(255, 255, 255, 0.90);
    }

    #topbar.scrolled {
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-row {
      display: block;
    }


    .title-logo {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .title-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      height: 56px;
    }

    .title-logo img {
      height: 100%;
      width: auto;
      max-width: 140px;
      object-fit: contain;
      border-radius: 8px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.2px;
      display: inline-block;
    }

    .brand .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
      background: var(--surface-2);
    }

    .icon-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .icon-btn.danger:hover {
      border-color: #e05252;
      color: #e05252;
    }

    .text-btn {
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .text-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    /* ================= Conteneur principal ================= */
    main {
      padding: 10px clamp(16px, 4vw, 48px) 60px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ================= Ensemble de tuiles (groupe) ================= */
    .group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .group.drag-over {
      box-shadow: 0 0 0 2px var(--accent);
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      user-select: none;
    }

    .group-title {
      font-weight: 600;
      font-size: 1.02rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chevron {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: var(--surface-2);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s, color 0.2s;
    }

    .group.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .group-header:hover .chevron {
      color: var(--text);
    }

    /* Animation de repli : grid-template-rows 0fr -> 1fr */
    .group-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 0.3s ease;
    }

    .group.collapsed .group-body {
      grid-template-rows: 0fr;
    }

    .group-body-inner {
      overflow: hidden;
      min-height: 0;
    }

    .tiles-grid {
      display: grid;
      gap: 12px;
      padding: 4px 16px 16px;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    }

    /* ================= Widgets intégrés à la topbar ================= */
    #topbarWidgets {
      flex: 1 1 420px;
      min-width: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    #topbarWidgets:empty {
      display: none;
    }

    #topbarWidgets .group[data-layout="header"] {
      width: min(var(--header-widget-width, 620px), 100%);
      margin: 0;
      background: transparent;
      border-color: transparent;
      overflow: visible;
    }

    #topbarWidgets .group[data-layout="header"] .group-header {
      display: none;
    }

    body.edit-mode #topbarWidgets .group[data-layout="header"] {
      background: var(--surface);
      border-color: var(--accent);
    }

    body.edit-mode #topbarWidgets .group[data-layout="header"] .group-header {
      display: flex;
    }

    #topbarWidgets .group[data-layout="header"] .tiles-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0;
    }

    body.edit-mode #topbarWidgets .group[data-layout="header"] .tiles-grid {
      padding: 4px 10px 10px;
    }

    #topbarWidgets .group[data-layout="header"] .tile {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
    }

    #topbarWidgets .group[data-layout="header"] .widget-global-search {
      min-height: 44px;
    }

    #topbarWidgets .group[data-layout="header"] .tile-body {
      padding: 6px;
    }

    #topbarWidgets .group[data-layout="header"] .global-search-meta {
      display: none;
    }

    #topbarWidgets .group[data-layout="header"] .resize-handle {
      display: none !important;
    }

    @media (max-width: 820px) {
      #topbar {
        flex-wrap: wrap;
      }

      #topbarWidgets {
        order: 3;
        flex-basis: 100%;
      }

      #topbarWidgets .group[data-layout="header"] {
        width: 100%;
      }
    }

    /* ================= Tuile ================= */
    .tile {
      position: relative;
      min-height: 110px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
    }

    .tile:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }

    .tile.drag-over {
      box-shadow: 0 0 0 2px var(--accent);
    }

    .tile-body {
      padding: 14px;
      height: 100%;
    }

    .tile.dragging {
      opacity: 0.45;
    }

    /* Contrôles d'édition sur chaque tuile */
    .tile-edit-bar {
      position: absolute;
      top: 6px;
      right: 6px;
      display: none;
      gap: 4px;
      z-index: 3;
    }

    .tile-edit-bar .icon-btn {
      width: 26px;
      height: 26px;
      font-size: 0.72rem;
      border-radius: 7px;
    }

    body.edit-mode .tile-edit-bar {
      display: flex;
    }

    body.edit-mode .tile {
      cursor: grab;
    }

    /* ================= Widgets ================= */
    .tile-link {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      min-height: 82px;
    }

    .tile-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      flex-shrink: 0;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .tile-title {
      font-weight: 600;
      font-size: 0.92rem;
      line-height: 1.25;
      word-break: break-word;

      text-align: center;
      width: 100%;
    }

    .tile-link {
      align-items: center;
    }

    /* Tuile lien avec image : l'image remplit la zone au-dessus du texte,
     proportions conservées (object-fit: contain), texte conservé dessous */
    .tile-with-image {
      min-height: 130px;
    }

    /* Densité homogène définie au niveau de chaque groupe.
     Le mode normal conserve l'affichage historique. */

    /* ==========================================================
    VERY COMPACT
    ========================================================== */

    .group[data-size="very-compact"] .tiles-grid {
      gap: 6px;
      padding: 2px 10px 10px;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    }

    .group[data-size="very-compact"] .group-header {
      padding: 9px 12px;
    }

    .group[data-size="very-compact"] .tile {
      min-height: 48px;
    }

    .group[data-size="very-compact"] .tile-body {
      padding: 7px 9px;
    }

    .group[data-size="very-compact"] .tile-link {
      min-height: 32px;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    .group[data-size="very-compact"] .tile-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .group[data-size="very-compact"] .tile-title {
      font-size: 0.78rem;
    }

    .group[data-size="very-compact"] .tile-with-image {
      min-height: 32px;
    }

    .group[data-size="very-compact"] .tile-image {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
    }

    .group[data-size="very-compact"] .widget-image img,
    .group[data-size="very-compact"] .image-fallback {
      min-height: 48px;
    }

    .group[data-size="very-compact"] .widget-clock {
      min-height: 32px;
      gap: 1px;
    }

    .group[data-size="very-compact"] .clock-date {
      font-size: 0.92rem;
    }

    .group[data-size="very-compact"] .clock-time,
    .group[data-size="very-compact"] .clock-week {
      font-size: 0.65rem;
    }

    .group[data-size="very-compact"] .widget-search {
      gap: 4px;
    }

    .group[data-size="very-compact"] .widget-search input {
      padding: 6px 8px;
    }

    .group[data-size="very-compact"] .widget-note,
    .group[data-size="very-compact"] .agenda-label {
      font-size: 0.78rem;
    }

    /* ==========================================================
   COMPACT
========================================================== */
    .group[data-size="compact"] .tiles-grid {
      gap: 8px;
      padding: 3px 12px 12px;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    }

    .group[data-size="compact"] .group-header {
      padding: 5px 6px;
    }

    .group[data-size="compact"] .tile {
      height: 130px;
      min-height: 130px;
      max-height: 130px;
    }

    .group[data-size="compact"] .tile-body {
      height: 100%;
      padding: 3px 4px;
      overflow: hidden;
    }

    .group[data-size="compact"] .tile-link {
      height: 100%;
      min-height: 0;
    }

    .group[data-size="compact"] .widget-clock,
    .group[data-size="compact"] .widget-search,
    .group[data-size="compact"] .widget-global-search,
    .group[data-size="compact"] .widget-note,
    .group[data-size="compact"] .widget-agenda,
    .group[data-size="compact"] .widget-image {
      height: 100%;
    }

    .group[data-size="compact"] .widget-note {
      overflow: hidden;
    }

    .group[data-size="compact"] .widget-agenda {
      overflow: hidden;
    }

    .group[data-size="compact"] .widget-search input,
    .group[data-size="compact"] .global-search-row input {
      height: 28px;
    }

    .group[data-size="compact"] .tile-icon {
      width: 14px;
      height: 14px;
      border-radius: 4px;

      /* taille de police volontairement conservée */
      font-size: 1rem;
    }

    .group[data-size="compact"] .tile-title {
      font-size: 0.84rem;
    }

    .group[data-size="compact"] .tile-with-image {
      min-height: 26px;
    }

    .group[data-size="compact"] .widget-image img,
    .group[data-size="compact"] .image-fallback {
      min-height: 26px;
    }

    .group[data-size="compact"] .widget-clock {
      min-height: 22px;
    }

    .group[data-size="compact"] .clock-date {
      font-size: 1.05rem;
    }


    /* ==========================================================
   NORMAL
========================================================== */
    .group[data-size="normal"] .tiles-grid {
      gap: 8px;
      padding: 3px 12px 12px;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }

    .group[data-size="normal"] .group-header {
      padding: 5px 6px;
    }

    .group[data-size="normal"] .tile {
      height: 180px;
      min-height: 180px;
      max-height: 180px;
    }

    .group[data-size="normal"] .tile-body {
      height: 100%;
      padding: 3px 4px;
      overflow: hidden;
    }

    .group[data-size="normal"] .tile-link {
      height: 100%;
      min-height: 0;
    }

    .group[data-size="normal"] .widget-clock,
    .group[data-size="normal"] .widget-search,
    .group[data-size="normal"] .widget-global-search,
    .group[data-size="normal"] .widget-note,
    .group[data-size="normal"] .widget-agenda,
    .group[data-size="normal"] .widget-image {
      height: 100%;
    }

    .group[data-size="normal"] .widget-note {
      overflow: hidden;
    }

    .group[data-size="normal"] .widget-agenda {
      overflow: hidden;
    }

    .group[data-size="normal"] .widget-search input,
    .group[data-size="normal"] .global-search-row input {
      height: 28px;
    }

    .group[data-size="normal"] .tile-icon {
      width: 14px;
      height: 14px;
      border-radius: 4px;

      /* taille de police volontairement conservée */
      font-size: 1rem;
    }

    .group[data-size="normal"] .tile-title {
      font-size: 0.84rem;
    }

    .group[data-size="normal"] .tile-with-image {
      min-height: 26px;
    }

    .group[data-size="normal"] .widget-image img,
    .group[data-size="normal"] .image-fallback {
      min-height: 26px;
    }

    .group[data-size="normal"] .widget-clock {
      min-height: 22px;
    }

    .group[data-size="normal"] .clock-date {
      font-size: 1.05rem;
    }

/*
    .group[data-size="normal"] .tile {
      min-height: 118px;
    }

    .group[data-size="normal"] .tile-body {
      padding: 15px;
    }

    .group[data-size="normal"] .tile-link {
      min-height: 88px;
      gap: 10px;
    }

    .group[data-size="normal"] .tile-with-image {
      min-height: 138px;
    }

    .group[data-size="normal"] .widget-image img,
    .group[data-size="normal"] .image-fallback {
      min-height: 118px;
    }

    .group[data-size="normal"] .widget-clock {
      min-height: 88px;
    }
*/
    /* ==========================================================
   LARGE
========================================================== */

    .group[data-size="large"] .tiles-grid {
      gap: 14px;
    }

    .group[data-size="large"] .tile {
      min-height: 155px;
    }

    .group[data-size="large"] .tile-body {
      padding: 18px;
    }

    .group[data-size="large"] .tile-link {
      min-height: 119px;
      gap: 13px;
    }

    .group[data-size="large"] .tile-icon {
      width: 52px;
      height: 52px;
      font-size: 1.45rem;
    }

    .group[data-size="large"] .tile-title {
      font-size: 1rem;
    }

    .group[data-size="large"] .tile-with-image {
      min-height: 175px;
    }

    .group[data-size="large"] .widget-image img,
    .group[data-size="large"] .image-fallback {
      min-height: 155px;
    }

    .tile-image {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .widget-clock {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
      height: 100%;
      min-height: 82px;
    }

    a.widget-clock:hover .clock-date {
      color: var(--accent);
    }

    .clock-week {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .clock-week b {
      color: var(--accent);
      font-size: 1.1rem;
      margin-left: 3px;
      font-variant-numeric: tabular-nums;
    }

    .clock-date {
      font-size: 1.28rem;
      font-weight: 700;
      text-transform: capitalize;
      line-height: 1.15;
      transition: color 0.2s;
    }

    .clock-time {
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    .widget-search {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    .widget-search form {
      display: flex;
      gap: 6px;
    }
    .widget-search-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
      overflow: auto;
    }
    .search-engine-row {
      display: grid;
      grid-template-columns: minmax(82px, 115px) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .search-engine-row .search-engine-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: var(--accent);
    }
    .search-engine-row form {
      min-width: 0;
    }
    .search-engine-manager {
      display: grid;
      gap: 14px;
    }
    .search-manager-section {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
    }
    .search-manager-section h4 {
      margin: 0 0 10px;
      font-size: .9rem;
    }
    .search-engine-choice {
      display: grid;
      grid-template-columns: 28px minmax(100px, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }
    .search-engine-choice:last-child { border-bottom: 0; }
    .search-engine-choice .engine-url {
      color: var(--muted);
      font-size: .72rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search-engine-choice .btn { padding: 5px 8px; }
    .search-engine-choice .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      filter: none;
    }
    .search-custom-form {
      display: grid;
      grid-template-columns: minmax(120px, .7fr) minmax(180px, 1.3fr) auto;
      gap: 8px;
      align-items: end;
    }
    .search-custom-form .field { margin: 0; }
    .search-manager-help { color: var(--muted); font-size: .76rem; line-height: 1.4; }
    @media (max-width: 700px) {
      .search-engine-row { grid-template-columns: 1fr; gap: 3px; }
      .search-custom-form { grid-template-columns: 1fr; }
    }

    .widget-search input {
      flex: 1;
      min-width: 0;
      padding: 9px 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
    }

    .widget-search input:focus {
      border-color: var(--accent);
    }

    .widget-search .go {
      border: none;
      border-radius: 9px;
      padding: 0 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .widget-global-search {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
      justify-content: center;
    }

    .global-search-row {
      display: flex;
      gap: 6px;
    }

    .global-search-row input {
      flex: 1;
      min-width: 0;
      padding: 9px 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
    }

    .global-search-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .global-search-clear {
      width: 38px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--muted);
      font-size: 1rem;
    }

    .global-search-clear:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .global-search-meta {
      color: var(--muted);
      font-size: 0.75rem;
      min-height: 1em;
    }

    .tile.search-hidden,
    .group.search-hidden {
      display: none !important;
    }

    .tile.search-match {
      border-color: var(--accent);
    }

    .search-engine-label {
      color: var(--muted);
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .search-engine-label strong {
      color: var(--accent);
      font-weight: 600;
    }

    .widget-image {
      display: block;
      height: 100%;
      min-height: 82px;
    }

    .widget-image img {
      width: 100%;
      height: 100%;
      min-height: 110px;
      object-fit: cover;
      display: block;
    }

    .image-fallback {
      height: 100%;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.8rem;
      background: var(--accent-soft);
    }

    .widget-agenda {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .agenda-item {
      display: flex;
      gap: 10px;
      align-items: baseline;
    }

    .agenda-date {
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 6px;
      padding: 3px 7px;
      min-width: 52px;
      text-align: center;
    }

    .agenda-label {
      font-size: 0.88rem;
      line-height: 1.3;
    }

    .agenda-meta {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .agenda-empty {
      color: var(--muted);
      font-size: 0.82rem;
      font-style: italic;
    }

    .widget-note-title {
      margin-bottom: 8px;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      color: var(--text);
    }

    .widget-note {
      font-size: 0.88rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ============ Redimensionnement / logos / zones de dépôt ============ */
    .resize-handle {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 22px;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: nwse-resize;
      user-select: none;
      border-radius: 7px;
      background: var(--accent-soft);
      z-index: 3;
    }

    .resize-handle:hover {
      color: var(--accent);
    }

    body.edit-mode .resize-handle {
      display: flex;
    }

    .group-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .tiles-grid.drop-zone {
      box-shadow: inset 0 0 0 2px var(--accent);
      border-radius: var(--radius-sm);
    }

    .grid-empty {
      display: none;
      grid-column: 1 / -1;
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
    }

    body.edit-mode .grid-empty {
      display: block;
    }

    .image-input {
      display: flex;
      gap: 6px;
    }

    .image-input input {
      flex: 1;
      min-width: 0;
    }

    .image-preview {
      margin-top: 8px;
    }

    .image-preview img {
      max-height: 52px;
      max-width: 110px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
    }

    /* ================= Barre d'ajout de groupe ================= */
    #addGroupBar {
      display: none;
      padding: 0 clamp(16px, 4vw, 48px) 60px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    body.edit-mode #addGroupBar {
      display: block;
    }

    #btnAddGroup {
      width: 100%;
      padding: 14px;
      font-size: 0.95rem;
    }

    /* Contrôles visibles uniquement en mode édition */
    .edit-only {
      display: none;
    }

    body.edit-mode .edit-only {
      display: inline-flex;
    }

    body.edit-mode .group-title {
      cursor: pointer;
    }

    /* ================= Modale ================= */
    #modalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 16, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(3px);
    }

    #modalOverlay.open {
      display: flex;
    }

    .modal {
      width: min(480px, calc(100vw - 32px));
      max-height: 85vh;
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .modal h3 {
      margin: 0 0 16px;
      font-size: 1.05rem;
    }

    .modal .field {
      margin-bottom: 14px;
    }

    .modal label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    .modal input[type="text"],
    .modal input[type="url"],
    .modal textarea,
    .modal select {
      width: 100%;
      padding: 9px 11px;
      border-radius: 9px;
      font-family: inherit;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .modal textarea {
      resize: vertical;
      min-height: 90px;
    }

    .modal input:focus,
    .modal textarea:focus,
    .modal select:focus {
      border-color: var(--accent);
    }

    .modal .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal .checkbox-row label {
      margin: 0;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      padding: 9px 18px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    .type-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .type-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      transition: border-color 0.2s, transform 0.15s;
    }

    .type-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .type-card .t-ico {
      font-size: 1.5rem;
    }

    .type-card .t-name {
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* ================= Import de favoris ================= */
    .bm-help {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .bm-help p {
      margin: 0 0 8px;
    }

    .bm-help kbd {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 0.9em;
      font-family: inherit;
    }

    .bm-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .bm-tree {
      max-height: 46vh;
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
    }

    .bm-item,
    .bm-folder-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 6px;
    }

    .bm-item:hover,
    .bm-folder-row:hover {
      background: var(--surface);
    }

    .bm-folder-row {
      font-weight: 600;
    }

    .bm-toggle {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
    }

    .bm-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bm-url {
      color: var(--muted);
      font-size: 0.75rem;
      max-width: 42%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bm-children {
      margin-left: 16px;
      padding-left: 6px;
      border-left: 1px dashed var(--border);
    }

    .bm-count {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 10px;
    }

    .bm-bookmarklet {
      display: block;
      text-align: center;
      padding: 12px;
      margin: 12px 0;
      border: 1px dashed var(--accent);
      border-radius: 10px;
      color: var(--accent);
      font-weight: 600;
      background: var(--accent-soft);
      cursor: grab;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      padding-bottom: 24px;
    }

    /* ==========================================================
       TOOLTIP PERSONNALISABLE DES TUILES
    ========================================================== */
    #tileTooltip {
      position: fixed;
      display: none;
      z-index: 3000;
      max-width: min(360px, calc(100vw - 24px));
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
      font-size: .78rem;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      pointer-events: none;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity .12s ease, transform .12s ease;
    }
    #tileTooltip.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================
   NOTE EDITOR
========================================================== */

    .note-editor-overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.45);

      z-index: 2000;

      backdrop-filter: blur(4px);
    }

    .note-editor-overlay.open {
      display: flex;
    }

    .note-editor-modal {

      width: 75vw;
      height: 80vh;

      max-width: 1600px;
      min-width: 700px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    .note-editor-header {

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 18px 22px;

      border-bottom: 1px solid var(--border);

      background: var(--surface-2);
    }

    .note-editor-header h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .note-editor-body {

      flex: 1;

      display: flex;

      padding: 0;
    }

    .note-editor-body textarea {

      flex: 1;

      resize: none;

      border: none;
      outline: none;

      background: transparent;

      color: var(--text);

      font-family: inherit;

      font-size: 0.95rem;
      line-height: 1.6;

      padding: 24px;

      white-space: pre-wrap;
    }

    .note-editor-footer {

      display: flex;
      justify-content: flex-end;
      gap: 10px;

      padding: 16px 22px;

      border-top: 1px solid var(--border);

      background: var(--surface-2);
    }

    /* Portable */

    @media (max-width: 1000px) {

      .note-editor-modal {
        width: 95vw;
        height: 90vh;
        min-width: auto;
      }
    }


    /* ==========================================================
       CALENDRIER DE LA TOPBAR
    ========================================================== */
    #pageDate {
      cursor: pointer;
      border-radius: 7px;
      padding: 2px 5px;
      margin-left: -5px;
    }

    #pageDate:hover,
    #pageDate:focus-visible {
      color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }

    .calendar-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(8, 10, 16, .58);
      backdrop-filter: blur(4px);
      z-index: 2100;
    }

    .calendar-overlay.open {
      display: flex;
    }

    .calendar-modal {
      width: min(1180px, 96vw);
      height: min(860px, 92vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .calendar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .calendar-header h2 {
      margin: 0;
      flex: 1;
      text-align: center;
      font-size: 1.15rem;
      text-transform: capitalize;
    }

    .calendar-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .calendar-view-switch {
      display: inline-flex;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .calendar-view-switch .btn {
      padding: 6px 10px;
      border: 0;
      background: transparent;
    }

    .calendar-view-switch .btn.active {
      color: #fff;
      background: var(--accent);
    }

    .calendar-week-scroll {
      display: inline-flex;
      gap: 4px;
    }

    .calendar-month-nav {
      display: inline-flex;
      gap: 5px;
    }

    .calendar-event.personal {
      padding-right: 22px;
      position: relative;
      cursor: default;
    }

    .calendar-event-delete {
      position: absolute;
      top: 1px;
      right: 2px;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      line-height: 1;
      opacity: .65;
    }

    .calendar-event-delete:hover {
      opacity: 1;
      color: #e05252;
      background: rgba(224, 82, 82, .14);
    }

    .calendar-event-form {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .calendar-event-form.open {
      display: block;
    }

    .calendar-event-form input,
    .calendar-event-form textarea {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
    }

    .calendar-event-form textarea {
      min-height: 64px;
      resize: vertical;
    }

    .calendar-event-form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
    }

    .calendar-source-preset {
      display: flex;
      gap: 6px;
    }

    .calendar-source-preset select {
      flex: 1;
      min-width: 0;
    }

    .calendar-grid.week-view .calendar-day,
    .calendar-grid.week-view .calendar-week-number {
      min-height: 430px;
    }

    .calendar-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 285px;
      flex: 1;
      min-height: 0;
    }

    .calendar-main {
      min-width: 0;
      padding: 14px;
      overflow: auto;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: 48px repeat(7, minmax(82px, 1fr));
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .calendar-week-head,
    .calendar-day-head {
      padding: 8px 4px;
      text-align: center;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
      background: var(--surface-2);
      border-right: 1px solid var(--border);
    }

    .calendar-day-head:last-child {
      border-right: 0;
    }

    .calendar-week-number {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 104px;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 700;
      background: var(--accent-soft);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .calendar-day {
      min-height: 104px;
      padding: 6px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .calendar-day:nth-child(8n) {
      border-right: 0;
    }

    .calendar-day.outside {
      opacity: .42;
      background: var(--surface-2);
    }

    .calendar-day.today {
      box-shadow: inset 0 0 0 2px var(--accent);
      background: var(--accent-soft);
    }

    .calendar-day-number {
      display: inline-flex;
      width: 25px;
      height: 25px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: .82rem;
      font-weight: 700;
    }

    .calendar-day.today .calendar-day-number {
      color: white;
      background: var(--accent);
    }

    .calendar-events {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 4px;
    }

    .calendar-event {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 3px 5px;
      border-radius: 5px;
      font-size: .68rem;
      background: var(--accent-soft);
      color: var(--text);
      border-left: 3px solid var(--accent);
    }

    .calendar-event.holiday {
      border-left-color: #e05252;
      background: color-mix(in srgb, #e05252 16%, transparent);
    }

    .calendar-event.school {
      border-left-color: #e49b28;
      background: color-mix(in srgb, #e49b28 17%, transparent);
    }

    .calendar-event.personal {
      border-left-color: #53a66f;
      background: color-mix(in srgb, #53a66f 17%, transparent);
    }

    .calendar-sidebar {
      padding: 16px;
      overflow: auto;
      border-left: 1px solid var(--border);
      background: var(--surface-2);
    }

    .calendar-sidebar h3 {
      margin: 0 0 12px;
      font-size: .95rem;
    }

    .calendar-field {
      margin-bottom: 14px;
    }

    .calendar-field label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
    }

    .calendar-field input[type="url"],
    .calendar-field select {
      width: 100%;
      padding: 8px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
    }

    .calendar-check {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 8px 0;
      font-size: .82rem;
    }

    .calendar-source-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .calendar-status {
      min-height: 1.2em;
      margin-top: 10px;
      color: var(--muted);
      font-size: .74rem;
      line-height: 1.35;
    }

    .calendar-legend {
      display: grid;
      gap: 7px;
      margin-top: 16px;
      font-size: .76rem;
    }

    .calendar-legend span::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .calendar-legend .holiday::before {
      background: #e05252;
    }

    .calendar-legend .school::before {
      background: #e49b28;
    }

    .calendar-legend .personal::before {
      background: #53a66f;
    }

    @media (max-width: 850px) {
      .calendar-modal {
        width: 98vw;
        height: 95vh;
      }

      .calendar-content {
        grid-template-columns: 1fr;
      }

      .calendar-sidebar {
        border-left: 0;
        border-top: 1px solid var(--border);
      }

      .calendar-grid {
        grid-template-columns: 37px repeat(7, minmax(68px, 1fr));
      }

      .calendar-day,
      .calendar-week-number {
        min-height: 86px;
      }
    }
  </style>
</head>

<body>

  <header id="topbar">
    <div class="brand">

      <span id="titleLogo" class="title-logo"></span>

      <div class="brand-content">

        <div class="brand-row">
          <h1 id="pageTitle"></h1>
